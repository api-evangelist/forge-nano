aid: forge-nano
name: Forge Nano
description: 'Forge Nano is a materials-technology manufacturer headquartered in Thornton,
  Colorado that commercializes particle and wafer Atomic Layer Deposition (ALD) under
  its Atomic Armor platform and patented ALDx architecture. The company applies atomic-scale
  nanocoatings to powders, electrodes and semiconductor wafers to improve energy density,
  cycle life, thermal stability and yield, and sells three lines of business: US-sourced
  lithium-ion cells from its Morrisville, North Carolina gigafactory, commercial semiconductor
  wafer-fabrication equipment including the TEPHRA cluster tool for 200mm wafers, and
  Powder ALD coating systems for batteries, catalysts and composites. Its markets are
  semiconductors, energy storage, defense and aerospace, AI hardware and quantum devices.
  Forge Nano is a hardware and advanced-materials company: as of this profiling pass
  it publishes no public developer portal, API, SDK or machine-readable API contract.'
